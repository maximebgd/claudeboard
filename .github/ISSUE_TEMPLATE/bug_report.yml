name: 🐛 Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first.
        ⚠️ Do **not** report security vulnerabilities here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I open /config/hooks, the editor shows…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? A minimal fixture `~/.claude` helps.
      placeholder: |
        1. Run `npm run dev`
        2. Go to '…'
        3. Click '…'
        4. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: claudeboard version / commit
      placeholder: v0.1.0 or commit sha
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.x
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Terminal output or browser console errors. This will be rendered as code, no backticks needed.
      render: shell
    validations:
      required: false
